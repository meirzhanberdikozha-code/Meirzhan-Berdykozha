<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Білгір: викторина</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eaf6f9;--card:#fff;--tx:#0b2a3a;--mu:#52717f;--ac:#0098b8;--acx:#fff;--gold:#f2b705;--ok:#15803d;--bad:#c0262d;--bd:#c9e0e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1e29;--card:#12303f;--tx:#eaf6f9;--mu:#8fb0bd;--ac:#3cc8e4;--acx:#04222b;--gold:#ffc61e;--ok:#4ade80;--bad:#f87171;--bd:#24485a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1e29;--card:#12303f;--tx:#eaf6f9;--mu:#8fb0bd;--ac:#3cc8e4;--acx:#04222b;--gold:#ffc61e;--ok:#4ade80;--bad:#f87171;--bd:#24485a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:34px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:22px;line-height:1.3;margin:18px 0 12px}
.mu{color:var(--mu)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:20px 20px 20px 6px;padding:16px 18px;margin:12px 0}
.card b{display:block;font-size:20px}
.card small{display:block;color:var(--mu)}
.em{font-size:30px}
.top{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--bd);margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold)}
.op{display:block;width:100%;text-align:left;font-size:18px;padding:14px 16px;margin:8px 0;background:var(--card);border:2px solid var(--bd);border-radius:14px}
.op:disabled{color:var(--tx)}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.op.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.lf{display:flex;gap:10px;margin-top:6px}
.lf button,.sec{flex:1;padding:10px;border-radius:12px;border:2px solid var(--bd);background:transparent}
.lf button:disabled{opacity:.4}
.pri{width:100%;padding:14px;margin-top:8px;border:0;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:700;font-size:17px}
.big{font-size:64px;font-weight:800;margin:8px 0;color:var(--ac)}
#fb p{margin:10px 0 2px;font-weight:600}
#fb p.mu{font-weight:400}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const LV={easy:[15,10],medium:[20,20],hard:[30,30]};
const G={
easy:[
()=>{const a=R(10,60),b=R(10,60);return[`${a} + ${b} = ?`,a+b,`${a} + ${b} = ${a+b}`]},
()=>{const a=R(30,99),b=R(10,a-5);return[`${a} − ${b} = ?`,a-b,`${a} − ${b} = ${a-b}`]},
()=>{const a=R(2,10),b=R(2,10);return[`${a} × ${b} = ?`,a*b,`${a} × ${b} = ${a*b}`]},
()=>{const b=R(2,10),q=R(2,10);return[`${b*q} ÷ ${b} = ?`,q,`${b*q} ÷ ${b} = ${q}`]},
()=>{const a=R(10,30),b=R(2,a-3);return[`Асылда ${a} алма бар. Ол ${b} алма жеді. Неше алма қалды?`,a-b,`${a} − ${b} = ${a-b}`]}],
medium:[
()=>{const a=R(11,25),b=R(3,9);return[`${a} × ${b} = ?`,a*b,`${a} × ${b} = ${a*b}`]},
()=>{const b=R(3,12),q=R(5,20);return[`${b*q} ÷ ${b} = ?`,q,`${b*q} ÷ ${b} = ${q}`]},
()=>{const p=P([10,20,25,50]),n=20*R(2,20);return[`${n} санының ${p}%-ы неше?`,n*p/100,`${n} × ${p}/100 = ${n*p/100}`]},
()=>{const a=R(3,20);return[`Қабырғасы ${a} см шаршының периметрі неше (см)?`,4*a,`4 × ${a} = ${4*a}`]},
()=>{const a=R(3,15),b=R(3,15);return[`Ұзындығы ${a} см, ені ${b} см тіктөртбұрыштың ауданы неше (см²)?`,a*b,`${a} × ${b} = ${a*b}`]},
()=>{const a=R(3,15),b=R(3,15);return[`Ұзындығы ${a} см, ені ${b} см тіктөртбұрыштың периметрі неше (см)?`,2*(a+b),`2 × (${a} + ${b}) = ${2*(a+b)}`]},
()=>{const a=R(2,20),b=R(2,9),c=R(2,9);return[`${a} + ${b} × ${c} = ?`,a+b*c,`Алдымен көбейту: ${b} × ${c} = ${b*c}, сосын ${a} + ${b*c} = ${a+b*c}`]},
()=>{const x=R(2,40),a=R(2,30);return[`x + ${a} = ${x+a}. x неге тең?`,x,`x = ${x+a} − ${a} = ${x}`]},
()=>{const x=R(2,12),a=R(2,9);return[`${a} × x = ${a*x}. x неге тең?`,x,`x = ${a*x} ÷ ${a} = ${x}`]}],
hard:[
()=>{const a=R(2,15),b=R(2,15),c=R(2,9);return[`(${a} + ${b}) × ${c} = ?`,(a+b)*c,`${a+b} × ${c} = ${(a+b)*c}`]},
()=>{const k=P([2,3,4,5,6]),m=R(3,15);return[`${k*m} санының 1/${k} бөлігі неше?`,m,`${k*m} ÷ ${k} = ${m}`]},
()=>{const a=R(4,15);return[`${a}² неше?`,a*a,`${a} × ${a} = ${a*a}`]},
()=>{const a=R(4,15);return[`√${a*a} неше?`,a,`${a} × ${a} = ${a*a}`]},
()=>{const a=R(1,20),d=R(2,9),s=[0,1,2,3].map(i=>a+i*d);return[`Қатарда келесі сан қандай: ${s.join(', ')}, ?`,a+4*d,`Айырмасы ${d}: ${s[3]} + ${d} = ${a+4*d}`]},
()=>{const x=R(2,15),a=R(2,9),b=R(2,9);return[`${b}x + ${a} = ${b*x+a}. x неге тең?`,x,`${b}x = ${b*x}, x = ${x}`]},
()=>{const b=P([4,6,8,10,12,14]),h=R(3,12);return[`Табаны ${b} см, биіктігі ${h} см үшбұрыштың ауданы неше (см²)?`,b*h/2,`${b} × ${h} ÷ 2 = ${b*h/2}`]}]};
const H=[
["Қазақ хандығы қай ғасырда құрылды?","XV ғасырда","XIII ғасырда","XVII ғасырда","XIX ғасырда"],
["Қазақ хандығының негізін қалаған хандар кімдер?","Керей мен Жәнібек","Абылай мен Кенесары","Тәуке мен Есім","Қасым мен Хақназар"],
["Қазақстан тәуелсіздігін қай жылы жариялады?","1991","1990","1993","1995"],
["«Жеті жарғы» заңдар жинағын кім жасады?","Тәуке хан","Абылай хан","Есім хан","Кенесары хан"],
["Қазақстан астанасы Алматыдан Ақмолаға қай жылы көшірілді?","1997","1991","1994","2000"],
["Қазақстанның тұңғыш Президенті кім?","Нұрсұлтан Назарбаев","Динмұхамед Қонаев","Ғани Мұратбаев","Оралбай Әбдіков"],
["1837–1847 жылдардағы көтерілісті кім басқарды?","Кенесары Қасымұлы","Исатай Тайманұлы","Сырым Датұлы","Жанқожа Нұралиұлы"],
["Қазақстанның ұлттық валютасы қандай?","Теңге","Рубль","Сом","Манат"],
["Теңге қай жылы айналымға енгізілді?","1993","1991","1995","1997"],
["Конституция күні қашан аталып өтеді?","30 тамыз","16 желтоқсан","1 мамыр","7 мамыр"],
["Тәуелсіздік күні қашан аталып өтеді?","16 желтоқсан","30 тамыз","1 мамыр","1 қаңтар"],
["«Екінші ұстаз» атанған ғұлама кім?","Әл-Фараби","Абай","Ибн Сина","Махмұд Қашқари"],
["«Қара сөздер» кітабының авторы кім?","Абай Құнанбайұлы","Мұхтар Әуезов","Жамбыл Жабаев","Ыбырай Алтынсарин"],
["Байқоңыр ғарыш айлағы қай облыста орналасқан?","Қызылорда облысы","Ақтөбе облысы","Атырау облысы","Маңғыстау облысы"],
["Ұлы Жібек жолы қай құрлықтарды байланыстырды?","Азия мен Еуропаны","Африка мен Американы","Америка мен Австралияны","Антарктида мен Африканы"],
["Тәуелсіз Қазақстанның бірінші астанасы қай қала?","Алматы","Астана","Шымкент","Түркістан"],
["Қазақстан туында қандай құс бейнеленген?","Қыран","Қарлығаш","Тырна","Көгершін"],
["Қазақстаннан шыққан тұңғыш ғарышкер кім?","Тоқтар Әубәкіров","Юрий Гагарин","Герман Титов","Нил Армстронг"],
["Алаш қозғалысының көсемі кім?","Әлихан Бөкейхан","Мағжан Жұмабаев","Мұхтар Әуезов","Қаныш Сәтбаев"],
["Аңырақай шайқасы қай жаумен болды?","Жоңғарлармен","Орыстармен","Қытайлармен","Арабтармен"],
["Наурыз мерекесі жылдың қай мезгілінде тойланады?","Көктемде","Күзде","Қыста","Жазда"],
["Сақ патшайымы, батыр әйел кім?","Томирис","Бопай","Домалақ ана","Айша бибі"],
["Кеңес Одағының Батыры атанған қазақ қызы кім?","Мәншүк Мәметова","Күләш Байсейітова","Бибігүл Төлегенова","Роза Бағланова"],
["«Алтын адам» қай жерден табылған?","Есік","Отырар","Сайрам","Тараз"],
["Отырар қаласын 1219–1220 жылдары кім жаулап алды?","Шыңғыс хан","Ақсақ Темір","Ескендір Зұлқарнайын","Батый хан"],
["Қазақстан БҰҰ-ға қай жылы мүше болды?","1992","1991","1994","2000"],
["ЭКСПО-2017 көрмесі қай қалада өтті?","Астана","Алматы","Шымкент","Қарағанды"],
["Қазақтың ұлттық аспабы қайсы?","Домбыра","Гитара","Скрипка","Фортепиано"],
["Исатай мен Махамбет бастаған көтеріліс қай жылдары болды?","1836–1838","1916–1917","1930–1931","1986"],
["Желтоқсан оқиғасы қай жылы болды?","1986","1991","1979","1989"]];
const near=(a,ds=[1,2,3,4,5,10,-1,-2,-3,-4,-5,-10])=>{const w=[];for(const d of sh(ds))if(a+d>0&&w.length<3&&!w.includes(String(a+d)))w.push(String(a+d));return w};
const num=(q,a,ex='')=>({q,c:String(a),w:near(a),ex});
const mk=f=>({q:f[0],c:f[1],w:f.slice(2),ex:''});
const fill=(gens,n)=>{const out=[],seen=new Set();let t=0;while(out.length<n&&t++<30000){const [q,a,ex]=P(gens)();if(!seen.has(q)){seen.add(q);out.push(num(q,a,ex))}}return out};
const play=(x,t,p)=>{const o=sh([x.c,...x.w]);return{q:x.q,o,a:o.indexOf(x.c),t,p,ex:x.ex||''}};
const pick=(pool,t)=>sh(pool).slice(0,15).map(x=>play(x,t,10));
const memo=f=>{let c;return()=>c||(c=f())};
const mathPool=memo(()=>({easy:fill(G.easy,100),medium:fill(G.medium,100),hard:fill(G.hard,100)}));
function mathQs(){const p=mathPool();return['easy','medium','hard'].flatMap(l=>sh(p[l]).slice(0,5).map(x=>play(x,LV[l][0],LV[l][1])))}
/* ТАРИХ */
const HF=H.concat([
["«Құтты білік» кітабының авторы кім?","Жүсіп Баласағұн","Махмұд Қашқари","Әл-Фараби","Абай"],
["«Диуани лұғат ат-түрік» сөздігін кім жазды?","Махмұд Қашқари","Жүсіп Баласағұн","Ибн Сина","Шоқан Уәлиханов"],
["«Абай жолы» романының авторы кім?","Мұхтар Әуезов","Сәкен Сейфуллин","Ілияс Жансүгіров","Сәбит Мұқанов"],
["Қазақстан Ғылым академиясының тұңғыш президенті кім?","Қаныш Сәтбаев","Шоқан Уәлиханов","Әлкей Марғұлан","Ыбырай Алтынсарин"],
["Қашғарға ғылыми сапар жасаған қазақ ғалымы кім?","Шоқан Уәлиханов","Ыбырай Алтынсарин","Абай Құнанбайұлы","Мұхамеджан Тынышпаев"],
["Алғашқы қазақ мектептерін ашқан ағартушы кім?","Ыбырай Алтынсарин","Шоқан Уәлиханов","Ахмет Байтұрсынұлы","Міржақып Дулатов"],
["«Тіл-құрал» оқулығының авторы кім?","Ахмет Байтұрсынұлы","Әлихан Бөкейхан","Міржақып Дулатов","Жүсіпбек Аймауытов"],
["«Сарыарқа» күйінің авторы кім?","Құрманғазы","Дәулеткерей","Тәттімбет","Қорқыт ата"],
["Қобыз өнерінің атасы саналатын тұлға кім?","Қорқыт ата","Құрманғазы","Дина Нұрпейісова","Ықылас"],
["Жыр алыбы атанған ақын кім?","Жамбыл Жабаев","Мағжан Жұмабаев","Сәкен Сейфуллин","Махамбет Өтемісұлы"],
["Кеңес Одағының Батыры атанған снайпер қыз кім?","Әлия Молдағұлова","Күләш Байсейітова","Роза Рымбаева","Бибігүл Төлегенова"],
["«Москва үшін шайқас» кітабының авторы кім?","Бауыржан Момышұлы","Мұхтар Әуезов","Сәбит Мұқанов","Қасым Қайсенов"],
["«Батыр Баян» поэмасының авторы кім?","Мағжан Жұмабаев","Ілияс Жансүгіров","Сәкен Сейфуллин","Бейімбет Майлин"],
["Қазақ КСР Компартиясын 1964–1986 жылдары басқарған кім?","Дінмұхамед Қонаев","Геннадий Колбин","Нұрсұлтан Назарбаев","Ғани Мұратбаев"],
["Қасым хан тұсында қандай заң жинағы болды?","Қасым ханның қасқа жолы","Жеті жарғы","Есім ханның ескі жолы","Алаш ережесі"],
["Қазақ жүздерінің саны нешеу?","Үш","Екі","Төрт","Бес"],
["Ұлы жүз қай өңірде орналасқан?","Жетісу","Батыс Қазақстан","Сарыарқа","Маңғыстау"],
["Қазақстанның мемлекеттік Туының авторы кім?","Шәкен Ниязбеков","Жандарбек Мәлібеков","Мұхтар Әуезов","Қаныш Сәтбаев"],

 if(S.i>=S.qs.length||S.lives<=0)return end();
 const q=S.qs[S.i];S.done=false;S.left=q.t;
 app.innerHTML=`<div class="top"><span>${'❤️'.repeat(S.lives)}</span><span>${S.i+1} / ${S.qs.length}</span><span>⭐ ${S.score}</span></div>
 <div class="bar"><i id="bi"></i></div><h2>${q.q}</h2>
 <div>${q.o.map((o,j)=>`<button class="op" data-j="${j}">${o}</button>`).join('')}</div>
 <div class="lf"><button id="ff" ${S.ff<1?'disabled':''}>50/50 (${S.ff})</button><button id="sk" ${S.sk<1?'disabled':''}>Өткізу (${S.sk})</button></div><div id="fb"></div>`;
 const ops=[...document.querySelectorAll('.op')];
 ops.forEach(b=>b.onclick=()=>answer(+b.dataset.j));
 $('#ff').onclick=()=>{if(S.done||S.ff<1)return;S.ff--;sh([0,1,2,3].filter(j=>j!==q.a)).slice(0,2).forEach(j=>{ops[j].disabled=true;ops[j].style.visibility='hidden'});$('#ff').textContent=`50/50 (${S.ff})`;$('#ff').disabled=true};
 $('#sk').onclick=()=>{if(S.done||S.sk<1)return;S.sk--;clearInterval(S.iv);S.i++;show()};
 clearInterval(S.iv);const t0=Date.now();
 S.iv=setInterval(()=>{S.left=q.t-(Date.now()-t0)/1000;$('#bi').style.width=Math.max(0,S.left/q.t*100)+'%';if(S.left<=0)answer(-1)},100);
}
function answer(i){
 if(S.done)return;S.done=true;clearInterval(S.iv);
 const q=S.qs[S.i],ok=i===q.a;let m;
 document.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
 if(ok){S.streak++;const bonus=S.streak%3===0,g=q.p+Math.floor(Math.max(0,S.left))+(bonus?15:0);S.score+=g;m=`✅ Дұрыс! +${g}`+(bonus?' (қатарынан 3 дұрыс жауап бонусы)':'')}
 else{S.streak=0;S.lives--;m=i<0?'⏱ Уақыт бітті!':'❌ Қате!'}
 const last=S.lives<=0||S.i>=S.qs.length-1;
 $('#fb').innerHTML=`<p>${m}</p>${q.ex?`<p class="mu">${q.ex}</p>`:''}<button id="nx" class="pri">${last?'Нәтижені көру':'Келесі сұрақ'}</button>`;
 $('#ff').disabled=true;$('#sk').disabled=true;
 $('#nx').onclick=()=>{S.i++;show()};
}
function end(){
 clearInterval(S.iv);const prev=best(S.k);save(S.k,S.score);
 app.innerHTML=`<h1>${S.lives>0?'Керемет!':'Ойын аяқталды'}</h1><p class="mu">${CATS[S.k].n}</p><div class="big">${S.score}</div>
 <p>${S.score>prev?'🏆 Жаңа рекорд!':'Рекорд: '+prev}</p>
 <button class="pri" id="again">Қайта ойнау</button><button class="pri sec" id="mn" style="background:transparent;color:var(--tx);border:2px solid var(--bd)">Мәзірге оралу</button>`;
 $('#again').onclick=()=>start(S.k);$('#mn').onclick=menu;
}
menu();
</script>
</body>
</html>
